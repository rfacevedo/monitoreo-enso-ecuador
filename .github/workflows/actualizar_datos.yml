name: Actualizar datos del día

# Cada día descarga NOAA, INOCAR, CIIFEN y demás fuentes y renueva datos_semilla.json; así la app muestra siempre los datos
# del día aunque nadie pulse «Actualizar datos». 11:00 UTC = 06:00 en Ecuador. También se puede lanzar a mano (Actions → Run workflow).
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de las fuentes
        run: pip install requests pypdf
      - name: Descargar las fuentes y renovar la semilla
        run: python actualizar_semilla.py
      - name: Subir la semilla si cambió
        run: |
          if git diff --quiet -- datos_semilla.json; then
            echo "Sin cambios en la semilla."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos_semilla.json
            git commit -m "Datos del día: renueva la semilla (NOAA, INOCAR, CIIFEN)"
            git push
          fi
